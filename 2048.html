<!DOCTYPE html>
<html>
<head>
<title>2048 - GameHub</title>

<style>
body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px;
}

h1 {
    font-size: 50px;
    margin-bottom: 5px;
}

#score {
    font-size: 22px;
    margin: 15px;
}

#game {
    width: 420px;
    height: 420px;
    margin: 25px auto;
    padding: 10px;
    background: #333;
    border-radius: 15px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    box-sizing: border-box;
}

.tile {
    background: #222;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
}

button {
    background: #6c2cff;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #8a5cff;
}
</style>
</head>

<body>

<h1>🧩 2048</h1>
<div id="score">Score: 0</div>

<div id="game"></div>

<button onclick="startGame()">🔄 Restart Game</button>

<script>

let board;
let score;

function startGame() {
    board = Array(16).fill(0);
    score = 0;

    addTile();
    addTile();

    updateBoard();
}

function addTile() {
    let empty = [];

    for (let i = 0; i < 16; i++) {
        if (board[i] === 0) {
            empty.push(i);
        }
    }

    if (empty.length === 0) return;

    let position = empty[Math.floor(Math.random() * empty.length)];

    board[position] = Math.random() < 0.9 ? 2 : 4;
}

function updateBoard() {

    let game = document.getElementById("game");
    game.innerHTML = "";

    board.forEach(value => {

        let tile = document.createElement("div");
        tile.className = "tile";

        tile.textContent = value === 0 ? "" : value;

        game.appendChild(tile);
    });

    document.getElementById("score").textContent =
        "Score: " + score;
}

function move(direction) {

    let oldBoard = [...board];

    if (direction === "left") {
        for (let r = 0; r < 4; r++) {
            let row = board.slice(r * 4, r * 4 + 4);
            row = combine(row);
            board.splice(r * 4, 4, ...row);
        }
    }

    if (direction === "right") {
        for (let r = 0; r < 4; r++) {
            let row = board.slice(r * 4, r * 4 + 4);
            row.reverse();
            row = combine(row);
            row.reverse();
            board.splice(r * 4, 4, ...row);
        }
    }

    if (direction === "up") {
        for (let c = 0; c < 4; c++) {

            let column = [];

            for (let r = 0; r < 4; r++) {
                column.push(board[r * 4 + c]);
            }

            column = combine(column);

            for (let r = 0; r < 4; r++) {
                board[r * 4 + c] = column[r];
            }
        }
    }

    if (direction === "down") {
        for (let c = 0; c < 4; c++) {

            let column = [];

            for (let r = 0; r < 4; r++) {
                column.push(board[r * 4 + c]);
            }

            column.reverse();
            column = combine(column);
            column.reverse();

            for (let r = 0; r < 4; r++) {
                board[r * 4 + c] = column[r];
            }
        }
    }

    if (JSON.stringify(oldBoard) !== JSON.stringify(board)) {
        addTile();
        updateBoard();
    }
}

function combine(line) {

    line = line.filter(x => x !== 0);

    for (let i = 0; i < line.length - 1; i++) {

        if (line[i] === line[i + 1]) {

            line[i] *= 2;
            score += line[i];

            line.splice(i + 1, 1);
        }
    }

    while (line.length < 4) {
        line.push(0);
    }

    return line;
}

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowLeft") {
        move("left");
    }

    if (event.key === "ArrowRight") {
        move("right");
    }

    if (event.key === "ArrowUp") {
        move("up");
    }

    if (event.key === "ArrowDown") {
        move("down");
    }

});

startGame();

</script>

</body>
</html>
