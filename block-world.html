<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block World - GameHub</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
    user-select:none;
}

canvas{
    display:block;
}

#info{
    position:fixed;
    top:15px;
    left:15px;
    z-index:20;
    color:white;
    background:rgba(0,0,0,.62);
    padding:14px 17px;
    border-radius:12px;
    line-height:1.5;
    font-size:14px;
    backdrop-filter:blur(5px);
}

#info b{
    font-size:21px;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:30;
    color:white;
    font-size:27px;
    font-weight:bold;
    pointer-events:none;
    text-shadow:0 0 5px black;
}

#startScreen{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(10,20,30,.35);
}

#start{
    padding:20px 38px;
    border:3px solid white;
    border-radius:15px;
    background:#6c2cff;
    color:white;
    font-size:23px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 10px 35px rgba(0,0,0,.4);
    transition:.2s;
}

#start:hover{
    transform:scale(1.06);
}

#hotbar{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    z-index:40;
    display:flex;
    gap:6px;
    padding:8px;
    background:rgba(0,0,0,.65);
    border-radius:12px;
    backdrop-filter:blur(5px);
}

.slot{
    width:60px;
    height:60px;
    border:3px solid #555;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:27px;
    background:rgba(30,30,30,.85);
    cursor:pointer;
    transition:.15s;
}

.slot:hover{
    transform:translateY(-3px);
}

.slot.selected{
    border-color:white;
    box-shadow:0 0 14px white;
}

.slot span{
    position:absolute;
    bottom:2px;
    right:5px;
    color:white;
    font-size:12px;
    font-weight:bold;
}

#message{
    position:fixed;
    left:50%;
    top:17%;
    transform:translateX(-50%);
    z-index:50;
    color:white;
    background:rgba(0,0,0,.72);
    padding:11px 20px;
    border-radius:10px;
    display:none;
    font-weight:bold;
}

#reset{
    position:fixed;
    top:15px;
    right:15px;
    z-index:40;
    padding:10px 15px;
    border:0;
    border-radius:9px;
    background:rgba(0,0,0,.65);
    color:white;
    cursor:pointer;
    font-size:14px;
}

#reset:hover{
    background:rgba(0,0,0,.8);
}

#back{
    position:fixed;
    bottom:20px;
    left:20px;
    z-index:40;
    padding:11px 16px;
    background:rgba(0,0,0,.65);
    color:white;
    text-decoration:none;
    border-radius:9px;
}

@media(max-width:600px){
    #info{
        font-size:11px;
    }

    #info b{
        font-size:16px;
    }

        width:46px;
        height:46px;
        font-size:21px;
    }

    #back{
        display:none;
    }
}
</style>

<body>

<div id="info">

    WASD = Move<br>

<div id="crosshair">+</div>

    <div class="slot" data-type="leaves">🍃<span>5</span></div>

<a id="back" href="index.html">⬅ GameHub</a>

<script>

/* =====================================================
   GAME SETUP
   ===================================================== */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
    0x87ceeb,
    45,
    150
);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    300
);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.5)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);


/* =====================================================
   LIGHTING
   ===================================================== */

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x557755,
    1.15
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
    0xffffff,
    1.7
);

sun.position.set(40,80,30);

sun.castShadow = true;

sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;

sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;

scene.add(sun);


/* =====================================================
   BLOCKS
   ===================================================== */

const blockSize = 2;
const blocks = [];

const materials = {

    grass:new THREE.MeshLambertMaterial({
        color:0x4caf32
    }),

    dirt:new THREE.MeshLambertMaterial({
        color:0x8b5a2b
    }),

    stone:new THREE.MeshLambertMaterial({
        color:0x777777
    }),

    wood:new THREE.MeshLambertMaterial({
        color:0x704214
    }),

    leaves:new THREE.MeshLambertMaterial({
        color:0x238b21,
        transparent:true,
        opacity:.92
    })
};


/* =====================================================
   CREATE BLOCK
   ===================================================== */

function createBlock(x,y,z,type="grass"){

    const geometry = new THREE.BoxGeometry(
        blockSize,
        blockSize,
        blockSize
    );

    const cube = new THREE.Mesh(
        geometry,
        materials[type] || materials.grass
    );

    cube.position.set(x,y,z);

    cube.userData.type = type;

    cube.castShadow = true;
    cube.receiveShadow = true;

    scene.add(cube);

    blocks.push(cube);

    return cube;
}


/* =====================================================
   REMOVE BLOCK
   ===================================================== */

function removeBlock(block){

    const index = blocks.indexOf(block);

    if(index !== -1){
        blocks.splice(index,1);
    }

    scene.remove(block);

    if(block.geometry){
        block.geometry.dispose();
    }
}


/* =====================================================
   CLEAR WORLD
   ===================================================== */

function clearWorld(){

    while(blocks.length){

        const block = blocks.pop();

        scene.remove(block);

        if(block.geometry){
            block.geometry.dispose();
        }
    }
}


/* =====================================================
   TREES
   ===================================================== */

function createTree(x,z){

    for(let y=1;y<=4;y++){

        createBlock(
            x,
            y*blockSize,
            z,
            "wood"
        );
    }

    for(let dx=-2;dx<=2;dx++){

        for(let dz=-2;dz<=2;dz++){

            if(
                Math.abs(dx)+Math.abs(dz)<=3
            ){

                createBlock(
                    x+dx*blockSize,
                    10,
                    z+dz*blockSize,
                    "leaves"
                );
            }
        }
    }
}


/* =====================================================
   WORLD
   ===================================================== */

function generateWorld(){

    clearWorld();

    for(let x=-25;x<=25;x++){

        for(let z=-25;z<=25;z++){

            let height = 0;

            const wave =
                Math.sin(x*.35) +
                Math.cos(z*.32);

            if(wave > 1.0){
                height = 2;
            }

            if(wave > 1.6){
                height = 4;
            }

            createBlock(
                x*blockSize,
                height,
                z*blockSize,
                "grass"
            );

            createBlock(
                x*blockSize,
                height-2,
                z*blockSize,
                "dirt"
            );

            createBlock(
                x*blockSize,
                height-4,
                z*blockSize,
                "stone"
            );
        }
    }

    /* TREES */

    createTree(-20,-15);
    createTree(-12,-8);
    createTree(18,-12);
    createTree(20,14);
    createTree(-18,18);
    createTree(5,17);
    createTree(-5,-20);

    /* EXTRA ROCKS */

    for(let i=0;i<18;i++){

        const x =
            Math.floor(Math.random()*40-20)*2;

        const z =
            Math.floor(Math.random()*40-20)*2;

        createBlock(
            x,
            3,
            z,
            "stone"
        );
    }
}


/* =====================================================
   WATER
   ===================================================== */

const waterGeometry =
    new THREE.PlaneGeometry(
        34,
        26,
        20,
        20
    );

const waterMaterial =
    new THREE.MeshPhongMaterial({

        color:0x2196d3,

        transparent:true,

        opacity:.62,

        shininess:100,

        side:THREE.DoubleSide
    });

const water =
    new THREE.Mesh(
        waterGeometry,
        waterMaterial
    );

water.rotation.x = -Math.PI/2;

water.position.set(
    0,
    1.15,
    -13
);

water.receiveShadow = true;

scene.add(water);


/* =====================================================
   CLOUDS
   ===================================================== */

function createCloud(x,y,z){

    const cloudMaterial =
        new THREE.MeshLambertMaterial({
            color:0xffffff,
            transparent:true,
            opacity:.88
        });

    const cloud = new THREE.Group();

    for(let i=0;i<5;i++){

        const size =
            3 + Math.random()*3;

        const geometry =
            new THREE.SphereGeometry(
                size,
                12,
                12
            );

        const part =
            new THREE.Mesh(
                geometry,
                cloudMaterial
            );

        part.position.set(
            i*3,
            Math.random()*1.5,
            Math.random()*2
        );

        cloud.add(part);
    }

    cloud.position.set(x,y,z);

    scene.add(cloud);
}

createCloud(-35,30,-30);
createCloud(5,35,-40);
createCloud(35,28,-20);
createCloud(-5,32,25);


/* =====================================================
   PLAYER
   ===================================================== */

const player = {

    x:0,

    y:5,

    z:8,

    speed:.18,

    height:3.5
};

let velocityY = 0;

let canJump = true;

let yaw = 0;

let pitch = 0;

let gameStarted = false;

const keys = {};

camera.position.set(
    player.x,
    player.y,
    player.z
);


/* =====================================================
   RAYCAST
   ===================================================== */

const raycaster =
    new THREE.Raycaster();

const center =
    new THREE.Vector2(0,0);


/* =====================================================
   HOTBAR
   ===================================================== */

let selectedType = "grass";

function updateHotbar(){

    document
    .querySelectorAll(".slot")
    .forEach(slot=>{

        slot.classList.remove(
            "selected"
        );

        if(
            slot.dataset.type ===
            selectedType
        ){

            slot.classList.add(
                "selected"
            );
        }
    });
}

document
.querySelectorAll(".slot")
.forEach(slot=>{

    slot.addEventListener(
        "click",
        function(){

            selectedType =
                this.dataset.type;

            updateHotbar();
        }
    );
});


/* =====================================================
   MESSAGE
   ===================================================== */

let messageTimer;

function showMessage(text){

    const message =
        document.getElementById(
            "message"
        );

    message.textContent = text;

    message.style.display = "block";

    clearTimeout(messageTimer);

    messageTimer =
        setTimeout(()=>{

            message.style.display =
                "none";

        },1000);
}


/* =====================================================
   BREAK BLOCK
   ===================================================== */

function breakBlock(){

    if(!gameStarted) return;

    raycaster.setFromCamera(
        center,
        camera
    );

    const hits =
        raycaster.intersectObjects(
            blocks
        );

    if(!hits.length) return;

    const hit = hits[0];

    if(hit.distance > 10) return;

    removeBlock(hit.object);

    saveWorld();

    showMessage("Block broken!");
}


/* =====================================================
   PLACE BLOCK
   ===================================================== */

function placeBlock(){

    if(!gameStarted) return;

    raycaster.setFromCamera(
        center,
        camera
    );

    const hits =
        raycaster.intersectObjects(
            blocks
        );

    if(!hits.length) return;

    const hit = hits[0];

    if(hit.distance > 10) return;

    const normal =
        hit.face.normal.clone();

    normal.transformDirection(
        hit.object.matrixWorld
    );

    const position =
        hit.object.position.clone();

    position.add(
        normal.multiplyScalar(
            blockSize
        )
    );

    const dx =
        position.x-player.x;

    const dy =
        position.y-player.y;

    const dz =
        position.z-player.z;

    if(
        Math.abs(dx)<1.8 &&
        Math.abs(dy)<2.5 &&
        Math.abs(dz)<1.8
    ){

        showMessage(
            "Can't place here!"
        );

        return;
    }

    const exists =
        blocks.some(block=>{

            return(
                Math.abs(
                    block.position.x-
                    position.x
                )<.01 &&

                Math.abs(
                    block.position.y-
                    position.y
                )<.01 &&

                Math.abs(
                    block.position.z-
                    position.z
                )<.01
            );
        });

    if(exists) return;

    createBlock(
        Math.round(
            position.x/blockSize
        )*blockSize,

        Math.round(
            position.y/blockSize
        )*blockSize,

        Math.round(
            position.z/blockSize
        )*blockSize,

        selectedType
    );

    saveWorld();

    showMessage(
        selectedType.toUpperCase()+
        " placed!"
    );
}


/* =====================================================
   MOUSE
   ===================================================== */

document.addEventListener(
    "mousedown",
    function(e){

        if(!gameStarted) return;

        if(
            document.pointerLockElement !==
            renderer.domElement
        ){
            return;
        }

        if(e.button===0){
            breakBlock();
        }

        if(e.button===2){
            placeBlock();
        }
    }
);


/* =====================================================
   RIGHT CLICK DISABLE
   ===================================================== */

document.addEventListener(
    "contextmenu",
    function(e){
        e.preventDefault();
    }
);


/* =====================================================
   KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        keys[
            e.key.toLowerCase()
        ] = true;

        if(e.code==="Space"){

            e.preventDefault();

            if(canJump){

                velocityY=.42;

                canJump=false;
            }
        }

        if(
            e.key>="1" &&
            e.key<="5"
        ){

            const types=[
                "grass",
                "dirt",
                "stone",
                "wood",
                "leaves"
            ];

            selectedType =
                types[
                    Number(e.key)-1
                ];

            updateHotbar();

            showMessage(
                selectedType.toUpperCase()
            );
        }
    }
);

document.addEventListener(
    "keyup",
    function(e){

        keys[
            e.key.toLowerCase()
        ] = false;
    }
);


/* =====================================================
   MOUSE LOOK
   ===================================================== */

document.addEventListener(
    "mousemove",
    function(e){

        if(
            document.pointerLockElement !==
            renderer.domElement
        ){
            return;
        }

        yaw -=
            e.movementX*.002;

        pitch -=
            e.movementY*.002;

        pitch =
            Math.max(
                -Math.PI/2+.05,
                Math.min(
                    Math.PI/2-.05,
                    pitch
                )
            );

        camera.rotation.order =
            "YXZ";

        camera.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;
    }
);


/* =====================================================
   START
   ===================================================== */

document
.getElementById("start")
.addEventListener(
    "click",
    function(){

        gameStarted=true;

        document
        .getElementById(
            "startScreen"
        )
        .style.display="none";

        renderer.domElement
        .requestPointerLock();
    }
);


/* =====================================================
   POINTER LOCK
   ===================================================== */

document.addEventListener(
    "pointerlockchange",
    function(){

        if(
            document.pointerLockElement !==
            renderer.domElement
        ){

            if(gameStarted){

                document
                .getElementById(
                    "startScreen"
                )
                .style.display="flex";
            }
        }
    }
);


/* =====================================================
   PLAYER MOVEMENT
   ===================================================== */

function updatePlayer(){

    if(!gameStarted) return;

    const speed =
        player.speed;

    const forward =
        new THREE.Vector3(
            -Math.sin(yaw),
            0,
            -Math.cos(yaw)
        );

    const right =
        new THREE.Vector3(
            Math.cos(yaw),
            0,
            -Math.sin(yaw)
        );

    if(keys["w"]){

        player.x +=
            forward.x*speed;

        player.z +=
            forward.z*speed;
    }

    if(keys["s"]){

        player.x -=
            forward.x*speed;

        player.z -=
            forward.z*speed;
    }

    if(keys["a"]){

        player.x -=
            right.x*speed;

        player.z -=
            right.z*speed;
    }

    if(keys["d"]){

        player.x +=
            right.x*speed;

        player.z +=
            right.z*speed;
    }

    /* GRAVITY */

    velocityY -= .018;

    player.y +=
        velocityY;

    /* GROUND */

    if(player.y<=4.5){

        player.y=4.5;

        velocityY=0;

        canJump=true;
    }

    /* WORLD LIMIT */

    player.x =
        THREE.MathUtils.clamp(
            player.x,
            -48,
            48
        );

    player.z =
        THREE.MathUtils.clamp(
            player.z,
            -48,
            48
        );

    camera.position.set(
        player.x,
        player.y,
        player.z
    );
}


/* =====================================================
   SAVE
   ===================================================== */

function saveWorld(){

    const data =
        blocks.map(block=>({

            x:block.position.x,

            y:block.position.y,

            z:block.position.z,

            type:block.userData.type
        }));

    localStorage.setItem(
        "blockWorldSave",
        JSON.stringify(data)
    );
}


/* =====================================================
   LOAD
   ===================================================== */

function loadWorld(){

    const saved =
        localStorage.getItem(
            "blockWorldSave"
        );

    if(!saved){

        generateWorld();

        return;
    }

    try{

        const data =
            JSON.parse(saved);

        clearWorld();

        data.forEach(block=>{

            createBlock(
                block.x,
                block.y,
                block.z,
                block.type
            );
        });

    }catch(error){

        console.error(
            "Save load error:",
            error
        );

        generateWorld();
    }
}


/* =====================================================
   RESET
   ===================================================== */

document
.getElementById("reset")
.addEventListener(
    "click",
    function(){

        if(
            !confirm(
                "Reset your Block World?"
            )
        ){
            return;
        }

        localStorage.removeItem(
            "blockWorldSave"
        );

        generateWorld();

        player.x=0;
        player.y=5;
        player.z=8;

        yaw=0;
        pitch=0;

        showMessage(
            "World reset!"
        );
    }
);


/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =====================================================
   START WORLD
   ===================================================== */

loadWorld();


/* =====================================================
   GAME LOOP
   ===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    updatePlayer();

    renderer.render(
        scene,
        camera
    );
}

BW_mobUI.textContent = "Mobs: 0";
document.body.appendChild(BW_mobUI);

function BW_refreshInventory(){
    const grid = document.getElementById("bwGrid");
    grid.innerHTML = "";

    const icons = {
        grass:"🌿", dirt:"🟫", stone:"⬜", wood:"🪵",
        leaves:"🍃", sand:"🟨", glass:"🔷", water:"💧"
    };

    Object.keys(icons).forEach(type=>{
        const item = document.createElement("div");
        item.className = "bwItem";
        item.innerHTML =
            `${icons[type]}<small>${BW_inventory[type] || 0}</small>`;
        grid.appendChild(item);
    });
}

function BW_toggleInventory(){
    BW_inventoryOpen = !BW_inventoryOpen;
    BW_panel.style.display =
        BW_inventoryOpen ? "block" : "none";

    paused = BW_inventoryOpen;

    if(BW_inventoryOpen){
        BW_refreshInventory();
    }
}

document.addEventListener("keydown", e=>{
    if(e.key.toLowerCase() === "e" && started){
        BW_toggleInventory();
    }
});

/* ---------- CAVES ---------- */
const BW_caves = new THREE.Group();
scene.add(BW_caves);

function BW_addCave(x,y,z){
    const cave = new THREE.Mesh(
        new THREE.CylinderGeometry(3.2,3.8,5.5,12,1,false),
        new THREE.MeshLambertMaterial({
            color:0x101010,
            side:THREE.BackSide
        })
    );

    cave.rotation.z = Math.PI / 2;
    cave.position.set(x,y,z);
    BW_caves.add(cave);

    const light = new THREE.PointLight(
        0xffa040,
        .55,
        11
    );

    light.position.set(x,y,z);
    BW_caves.add(light);
}

[
    [-28,2,-12],
    [-12,2,26],
    [24,2,-24],
    [30,2,10],
    [-34,2,18]
].forEach(p=>BW_addCave(...p));

/* ---------- MOBS ---------- */
const BW_mobs = [];

function BW_spawnMob(x,z,type="sheep"){
    const group = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.9,1.25,2.4),
        new THREE.MeshLambertMaterial({
            color:type==="zombie" ? 0x4d8b58 : 0xe5e5e5
        })
    );

    body.position.y = 2;
    group.add(body);

    const head = new THREE.Mesh(
        new THREE.BoxGeometry(1.15,1.15,1.15),
        new THREE.MeshLambertMaterial({
            color:type==="zombie" ? 0x397247 : 0xf1f1f1
        })
    );

    head.position.set(0,2.85,1.25);
    group.add(head);

    group.position.set(x,0,z);

    group.userData = {
        type:type,
        baseX:x,
        baseZ:z,
        phase:Math.random()*10,
        speed:type==="zombie" ? .018 : .008
    };

    scene.add(group);
    BW_mobs.push(group);
}

[
    [-16,-4,"sheep"],
    [12,14,"sheep"],
    [-22,12,"cow"],
    [20,-14,"zombie"],
    [4,20,"sheep"],
    [-8,-20,"cow"]
].forEach(p=>BW_spawnMob(...p));

function BW_updateMobs(){
    BW_mobs.forEach(mob=>{
        const u = mob.userData;
        u.phase += .025;

        if(
            u.type === "zombie" &&
            started &&
            !paused
        ){
            const dx = player.x - mob.position.x;
            const dz = player.z - mob.position.z;
            const distance = Math.hypot(dx,dz);

            if(distance < 18 && distance > 2){
                mob.position.x += dx/distance*u.speed;
                mob.position.z += dz/distance*u.speed;
                mob.rotation.y = Math.atan2(dx,dz);
            }else{
                mob.position.x =
                    u.baseX + Math.sin(u.phase*.55)*3;
                mob.position.z =
                    u.baseZ + Math.cos(u.phase*.45)*3;
            }
        }else{
            mob.position.x =
                u.baseX + Math.sin(u.phase*.45)*3;
            mob.position.z =
                u.baseZ + Math.cos(u.phase*.38)*3;
        }

        if(typeof groundY === "function"){
            const ground = groundY(
                mob.position.x,
                mob.position.z
            );

            if(ground > -Infinity){
                mob.position.y = ground + 1;
            }
        }
    });

    BW_mobUI.textContent =
        "Mobs: " + BW_mobs.length;
}

/* ---------- V2 GAME LOOP ---------- */
function BW_gameLoop(){
    requestAnimationFrame(BW_gameLoop);

    if(typeof updateDayNight === "function"){
        updateDayNight();
    }

    if(typeof updatePlayer === "function"){
        updatePlayer();
    }

    BW_updateMobs();

    if(typeof updateStats === "function"){
        updateStats();
    }

    renderer.render(scene,camera);
}

BW_refreshInventory();
BW_gameLoop();
