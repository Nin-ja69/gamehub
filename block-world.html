<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Block World - GameHub</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#87ceeb;
 font-family:Arial,sans-serif;
 user-select:none
}

canvas{display:block}

#info,#reset,#back,#stats,#hotbar,#startScreen,#message,#crosshair{
 position:fixed;
 z-index:20
}

#info{
 top:14px;
 left:14px;
 color:#fff;
 background:rgba(0,0,0,.62);
 padding:12px 15px;
 border-radius:12px;
 line-height:1.45;
 backdrop-filter:blur(6px);
 text-shadow:0 1px 2px #000
}

#info b{font-size:20px}

#stats{
 top:14px;
 right:14px;
 color:#fff;
 background:rgba(0,0,0,.52);
 padding:9px 12px;
 border-radius:10px;
 font-size:13px;
 text-align:right
}

#crosshair{
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 color:#fff;
 font-size:28px;
 font-weight:bold;
 pointer-events:none;
 text-shadow:0 0 5px #000
}

#startScreen{
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 background:rgba(8,18,28,.42);
 z-index:100
}

#start{
 padding:18px 34px;
 border:3px solid #fff;
 border-radius:14px;
 background:#6c2cff;
 color:#fff;
 font-size:22px;
 font-weight:bold;
 cursor:pointer;
 box-shadow:0 10px 35px rgba(0,0,0,.4)
}

#start:hover{transform:scale(1.05)}

#hotbar{
 left:50%;
 bottom:18px;
 transform:translateX(-50%);
 display:flex;
 gap:5px;
 padding:7px;
 background:rgba(0,0,0,.65);
 border-radius:12px;
 backdrop-filter:blur(7px)
}

.slot{
 width:58px;
 height:58px;
 border:3px solid #555;
 border-radius:8px;
 background:rgba(25,25,25,.9);
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
 cursor:pointer;
 transition:.12s
}

.slot:hover{transform:translateY(-3px)}

.slot.selected{
 border-color:#fff;
 box-shadow:0 0 15px #fff
}

.slot span{
 position:absolute;
 right:4px;
 bottom:2px;
 color:#fff;
 font-size:12px;
 font-weight:bold
}

#reset{
 top:70px;
 right:14px;
 border:0;
 border-radius:9px;
 padding:9px 13px;
 background:rgba(0,0,0,.62);
 color:#fff;
 cursor:pointer
}

#back{
 bottom:18px;
 left:18px;
 padding:10px 15px;
 border-radius:9px;
 background:rgba(0,0,0,.62);
 color:#fff;
 text-decoration:none
}

#message{
 left:50%;
 top:16%;
 transform:translateX(-50%);
 display:none;
 color:#fff;
 background:rgba(0,0,0,.72);
 padding:10px 18px;
 border-radius:10px;
 font-weight:bold
}

@media(max-width:650px){
 #info{font-size:11px}
 .slot{width:45px;height:45px}
 #back{display:none}
}
</style>
</head>

<body>

<div id="info">
<b>🧱 Block World</b><br>
WASD = Move &nbsp; SPACE = Jump<br>
Mouse = Look &nbsp; Shift = Sprint<br>
Left Click = Break &nbsp; Right Click = Place<br>
1-8 = Select Block &nbsp; ESC = Pause
</div>

<div id="stats">Blocks: 0<br>Time: Day</div>

<div id="crosshair">+</div>

<div id="startScreen">
<button id="start">▶ CLICK TO PLAY</button>
</div>

<div id="message"></div>

<button id="reset">↻ New World</button>

<div id="hotbar"></div>

<a id="back" href="index.html">⬅ GameHub</a>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js";


const BLOCK=2;
const WORLD=28;
const WATER_LEVEL=1;

const blocks=[];
const blockMap=new Map();
const keys={};

let selected="grass";
let started=false;
let paused=false;
let velocityY=0;
let canJump=false;

let yaw=0;
let pitch=0;
let time=0;
let messageTimer=0;


const player={
 x:0,
 y:6,
 z:10,
 height:3.6,
 speed:0.11
};


const raycaster=new THREE.Raycaster();
const center=new THREE.Vector2(0,0);


const scene=new THREE.Scene();

scene.background=new THREE.Color(0x87ceeb);

scene.fog=new THREE.Fog(
 0x87ceeb,
 45,
 135
);


const camera=new THREE.PerspectiveCamera(
 75,
 innerWidth/innerHeight,
 .1,
 260
);

camera.rotation.order="YXZ";


const renderer=new THREE.WebGLRenderer({
 antialias:true
});

renderer.setSize(
 innerWidth,
 innerHeight
);

renderer.setPixelRatio(
 Math.min(devicePixelRatio,1.35)
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
 THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
 THREE.SRGBColorSpace;

document.body.appendChild(
 renderer.domElement
);


scene.add(
 new THREE.HemisphereLight(
  0xbfeaff,
  0x40552f,
  1.25
 )
);


const sun=
 new THREE.DirectionalLight(
  0xffffff,
  1.8
 );

sun.position.set(
 40,
 80,
 25
);

sun.castShadow=true;

sun.shadow.mapSize.set(
 1024,
 1024
);

sun.shadow.camera.left=-80;
sun.shadow.camera.right=80;
sun.shadow.camera.top=80;
sun.shadow.camera.bottom=-80;

scene.add(sun);


const sky=
 new THREE.Mesh(
  new THREE.SphereGeometry(
   180,
   24,
   16
  ),
  new THREE.MeshBasicMaterial({
   color:0x87ceeb,
   side:THREE.BackSide
  })
 );

scene.add(sky);


function texture(color,detail="#00000000"){

 const c=
 document.createElement("canvas");

 c.width=16;
 c.height=16;

 const x=c.getContext("2d");

 x.fillStyle=color;
 x.fillRect(
  0,
  0,
  16,
  16
 );

 x.globalAlpha=.18;

 for(let i=0;i<30;i++){

  x.fillStyle=detail;

  x.fillRect(
   Math.random()*16,
   Math.random()*16,
   1+Math.random()*2,
   1+Math.random()*2
  );

 }

 const t=
 new THREE.CanvasTexture(c);

 t.magFilter=
 THREE.NearestFilter;

 t.minFilter=
 THREE.NearestFilter;

 return t;
}


const tex={

 grass:texture(
  "#58a936",
  "#173d16"
 ),

 dirt:texture(
  "#8b5a2b",
  "#4d2e18"
 ),

 stone:texture(
  "#888",
  "#444"
 ),

 wood:texture(
  "#70451f",
  "#3d2411"
 ),

 leaves:texture(
  "#2e8f2d",
  "#124f16"
 ),

 sand:texture(
  "#d9c27a",
  "#8f7b42"
 ),

 glass:texture(
  "#bdefff",
  "#ffffff"
 ),

 water:texture(
  "#268fd0",
  "#0d4f87"
 )

};


const mats={

 grass:
 new THREE.MeshLambertMaterial({
  map:tex.grass
 }),

 dirt:
 new THREE.MeshLambertMaterial({
  map:tex.dirt
 }),

 stone:
 new THREE.MeshLambertMaterial({
  map:tex.stone
 }),

 wood:
 new THREE.MeshLambertMaterial({
  map:tex.wood
 }),

 leaves:
 new THREE.MeshLambertMaterial({
  map:tex.leaves,
  transparent:true,
  opacity:.9
 }),

 sand:
 new THREE.MeshLambertMaterial({
  map:tex.sand
 }),

 glass:
 new THREE.MeshLambertMaterial({
  map:tex.glass,
  transparent:true,
  opacity:.45
 }),

 water:
 new THREE.MeshLambertMaterial({
  map:tex.water,
  transparent:true,
  opacity:.58,
  depthWrite:false
 })

};


const types=[
 "grass",
 "dirt",
 "stone",
 "wood",
 "leaves",
 "sand",
 "glass",
 "water"
];


function key(x,y,z){

 return x+","+y+","+z;

}


function has(x,y,z){

 return blockMap.has(
  key(x,y,z)
 );

}


function createBlock(
 x,
 y,
 z,
 type
){

 if(has(x,y,z))
  return null;

 const g=
 new THREE.BoxGeometry(
  BLOCK,
  BLOCK,
  BLOCK
 );

 const m=
 new THREE.Mesh(
  g,
  mats[type] || mats.grass
 );

 m.position.set(
  x,
  y,
  z
 );

 m.userData={
  type,
  x,
  y,
  z
 };

 m.castShadow=
  type!=="water";

 m.receiveShadow=true;

 scene.add(m);

 blocks.push(m);

 blockMap.set(
  key(x,y,z),
  m
 );

 return m;

}


function removeBlock(m){

 if(!m)
  return;

 const p=m.userData;

 blockMap.delete(
  key(
   p.x,
   p.y,
   p.z
  )
 );

 const i=
 blocks.indexOf(m);

 if(i>=0)
  blocks.splice(i,1);

 scene.remove(m);

 m.geometry.dispose();

}


function heightAt(x,z){

 return Math.max(
  0,
  Math.floor(
   2
   +Math.sin(x*.38)*1.5
   +Math.cos(z*.31)*1.2
   +Math.sin((x+z)*.16)*1.3
  )
 );

}


function tree(gx,gz,base){

 for(let y=0;y<4;y++){

  createBlock(
   gx,
   (base+y)*BLOCK,
   gz,
   "wood"
  );

 }


 for(
  let dx=-2;
  dx<=2;
  dx++
 ){

  for(
   let dz=-2;
   dz<=2;
   dz++
  ){

   for(
    let dy=3;
    dy<=4;
    dy++
   ){

    if(
     Math.abs(dx)
     +Math.abs(dz)
     +(dy===4?1:0)
     <=3
    ){

     createBlock(
      gx+dx*BLOCK,
      (base+dy)*BLOCK,
      gz+dz*BLOCK,
      "leaves"
     );

    }

   }

  }

 }

}


function generateWorld(){

 while(blocks.length)
  removeBlock(
   blocks[0]
  );


 for(
  let x=-WORLD;
  x<=WORLD;
  x++
 ){

  for(
   let z=-WORLD;
   z<=WORLD;
   z++
  ){

   const h=
    heightAt(x,z);


   for(
    let y=0;
    y<=h;
    y++
   ){

    const type=
     y===h
      ? "grass"
      : y>h-3
       ? "dirt"
       : "stone";

    createBlock(
     x*BLOCK,
     y*BLOCK,
     z*BLOCK,
     type
    );

   }


   if(h<=1){

    createBlock(
     x*BLOCK,
     (h+1)*BLOCK,
     z*BLOCK,
     "sand"
    );

   }

  }

 }


 const trees=[
  [-18,-14],
  [-10,8],
  [4,-17],
  [15,-8],
  [18,14],
  [-20,15],
  [8,12]
 ];


 trees.forEach(
  ([x,z])=>
   tree(
    x*BLOCK,
    z*BLOCK,
    heightAt(x,z)+1
   )
 );


 for(
  let x=-WORLD;
  x<=WORLD;
  x++
 ){

  for(
   let z=-WORLD;
   z<=WORLD;
   z++
  ){

   const h=
    heightAt(x,z);

   if(h<1){

    createBlock(
     x*BLOCK,
     (WATER_LEVEL+1)*BLOCK,
     z*BLOCK,
     "water"
    );

   }

  }

 }


 saveWorld();
 updateStats();

}


function saveWorld(){

 const data=
  blocks.map(
   m=>m.userData
  );

 localStorage.setItem(
  "blockWorldMaxSave",
  JSON.stringify(data)
 );

}


function loadWorld(){

 const raw=
  localStorage.getItem(
   "blockWorldMaxSave"
  );

 if(!raw){

  generateWorld();
  return;

 }

 try{

  const data=
   JSON.parse(raw);

  data.forEach(
   p=>
    createBlock(
     p.x,
     p.y,
     p.z,
     p.type
    )
  );

  updateStats();

 }catch(e){

  localStorage.removeItem(
   "blockWorldMaxSave"
  );

  generateWorld();

 }

}


function solidForCollision(
 x,
 y,
 z
){

 const m=
  blockMap.get(
   key(x,y,z)
  );

 return m
  && m.userData.type!=="water"
  && m.userData.type!=="leaves";

}


function groundY(px,pz){

 const gx=
  Math.round(px/BLOCK);

 const gz=
  Math.round(pz/BLOCK);

 let best=-Infinity;

 for(
  let y=-1;
  y<20;
  y++
 ){

  if(
   solidForCollision(
    gx*BLOCK,
    y*BLOCK,
    gz*BLOCK
   )
  ){

   best=
    Math.max(
     best,
     y*BLOCK+BLOCK/2
    );

  }

 }

 return best;

}


function updatePlayer(){

 if(!started || paused)
  return;


 const speed=
  keys.shift
   ? .18
   : player.speed;


 const forward=
  new THREE.Vector3(
   -Math.sin(yaw),
   0,
   -Math.cos(yaw)
  );


 const right=
  new THREE.Vector3(
   Math.cos(yaw),
   0,
   -Math.sin(yaw)
  );


 let dx=0;
 let dz=0;


 if(keys.w){

  dx+=forward.x;
  dz+=forward.z;

 }

 if(keys.s){

  dx-=forward.x;
  dz-=forward.z;

 }

 if(keys.a){

  dx-=right.x;
  dz-=right.z;

 }

 if(keys.d){

  dx+=right.x;
  dz+=right.z;

 }


 const len=
  Math.hypot(dx,dz)
  ||1;


 if(dx||dz){

  dx/=len;
  dz/=len;

 }


 const nx=
  player.x+dx*speed;

 const nz=
  player.z+dz*speed;


 const gy=
  groundY(nx,nz);


 if(
  gy>-Infinity
  &&
  player.y-1.8<=gy+1.05
 ){

  player.y=
   gy+3.7;

 }else{

  player.x=nx;
  player.z=nz;

 }


 velocityY-=.018;

 player.y+=velocityY;


 const g=
  groundY(
   player.x,
   player.z
  );


 if(
  g>-Infinity
  &&
  player.y<=g+3.7
 ){

  player.y=
   g+3.7;

  velocityY=0;

  canJump=true;

 }


 player.x=
  THREE.MathUtils.clamp(
   player.x,
   -WORLD*BLOCK,
   WORLD*BLOCK
  );


 player.z=
  THREE.MathUtils.clamp(
   player.z,
   -WORLD*BLOCK,
   WORLD*BLOCK
  );


 camera.position.set(
  player.x,
  player.y,
  player.z
 );

}


function breakBlock(){

 raycaster.setFromCamera(
  center,
  camera
 );

 const hit=
  raycaster.intersectObjects(
   blocks,
   false
  )[0];


 if(!hit ||
    hit.distance>10)
  return;


 if(
  hit.object.userData.type
  ==="water"
 ){

  show(
   "Water can't be mined"
  );

  return;

 }


 removeBlock(
  hit.object
 );

 saveWorld();

 updateStats();

 show(
  "Block broken!"
 );

}


function placeBlock(){

 raycaster.setFromCamera(
  center,
  camera
 );

 const hit=
  raycaster.intersectObjects(
   blocks,
   false
  )[0];


 if(!hit ||
    hit.distance>10)
  return;


 const n=
  hit.face.normal
   .clone()
   .transformDirection(
    hit.object.matrixWorld
   );


 const p=
  hit.object.position
   .clone()
   .add(
    n.multiplyScalar(BLOCK)
   );


 const x=
  Math.round(p.x/BLOCK)*BLOCK;

 const y=
  Math.round(p.y/BLOCK)*BLOCK;

 const z=
  Math.round(p.z/BLOCK)*BLOCK;


 if(
  Math.abs(x-player.x)<1.7
  &&
  Math.abs(z-player.z)<1.7
  &&
  Math.abs(y-player.y)<3.5
 ){

  show(
   "Can't place here"
  );

  return;

 }


 if(has(x,y,z))
  return;


 createBlock(
  x,
  y,
  z,
  selected
 );

 saveWorld();

 updateStats();

 show(
  selected+" placed"
 );

}


function show(t){

 const el=
  document.getElementById(
   "message"
  );

 el.textContent=t;

 el.style.display=
  "block";

 clearTimeout(
  messageTimer
 );

 messageTimer=
  setTimeout(
   ()=>{
    el.style.display=
     "none";
   },
   850
  );

}


function updateStats(){

 document.getElementById(
  "stats"
 ).innerHTML=
  `Blocks: ${blocks.length}<br>
   Time: ${time<.5?"Day":"Night"}`;

}


function select(t){

 selected=t;

 document
  .querySelectorAll(".slot")
  .forEach(
   s=>
    s.classList.toggle(
     "selected",
     s.dataset.type===t
    )
  );

 show(
  t.toUpperCase()
 );

}


function makeHotbar(){

 const bar=
  document.getElementById(
   "hotbar"
  );


 types.forEach(
  (t,i)=>{

   const s=
    document.createElement(
     "div"
    );

   s.className=
    "slot"+
    (i===0
     ?" selected"
     :"");

   s.dataset.type=t;


   const icon=
    document.createElement(
     "div"
    );


   icon.textContent={
    grass:"🌿",
    dirt:"🟫",
    stone:"⬜",
    wood:"🪵",
    leaves:"🍃",
    sand:"🟨",
    glass:"🔷",
    water:"💧"
   }[t];


   icon.style.fontSize=
    "25px";


   s.append(icon);


   const n=
    document.createElement(
     "span"
    );

   n.textContent=i+1;

   s.append(n);


   s.onclick=
    ()=>select(t);


   bar.append(s);

  }
 );

}


document.addEventListener(
 "keydown",
 e=>{

  keys[
   e.key.toLowerCase()
  ]=true;


  if(e.code==="Space"){

   e.preventDefault();

   if(canJump){

    velocityY=.42;

    canJump=false;

   }

  }


  if(
   e.key>="1"
   &&
   e.key<="8"
  ){

   select(
    types[
     Number(e.key)-1
    ]
   );

  }


  if(
   e.code==="Escape"
   &&
   started
  ){

   paused=true;

   document
    .getElementById(
     "startScreen"
    )
    .style.display="flex";

  }

 }
);


document.addEventListener(
 "keyup",
 e=>{
  keys[
   e.key.toLowerCase()
  ]=false;
 }
);


document.addEventListener(
 "mousemove",
 e=>{

  if(
   document.pointerLockElement
   !==renderer.domElement
   ||
   paused
  )
   return;


  yaw-=
   e.movementX*.0022;

  pitch-=
   e.movementY*.0022;


  pitch=
   THREE.MathUtils.clamp(
    pitch,
    -Math.PI/2+.05,
    Math.PI/2-.05
   );


  camera.rotation.y=
   yaw;

  camera.rotation.x=
   pitch;

 }
);


document.addEventListener(
 "mousedown",
 e=>{

  if(
   !started
   ||
   paused
   ||
   document.pointerLockElement
   !==renderer.domElement
  )
   return;


  if(e.button===0)
   breakBlock();


  if(e.button===2)
   placeBlock();

 }
);


document.addEventListener(
 "contextmenu",
 e=>
  e.preventDefault()
);


document.getElementById(
 "start"
).onclick=()=>{

 started=true;

 paused=false;

 document.getElementById(
  "startScreen"
 ).style.display=
  "none";


 renderer.domElement
  .requestPointerLock();

};


document.addEventListener(
 "pointerlockchange",
 ()=>{

  if(
   started
   &&
   document.pointerLockElement
   !==renderer.domElement
  ){

   paused=true;

   document.getElementById(
    "startScreen"
   ).style.display=
    "flex";

  }

 }
);


document.getElementById(
 "reset"
).onclick=()=>{

 if(
  confirm(
   "Generate a completely new Block World?"
  )
 ){

  localStorage.removeItem(
   "blockWorldMaxSave"
  );

  player.x=0;
  player.y=8;
  player.z=10;

  yaw=0;
  pitch=0;

  generateWorld();

  show(
   "New world generated!"
  );

 }

};


addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );

 }
);


function animate(){

 requestAnimationFrame(
  animate
 );


 time=
  (time+.0007)%1;


 const night=
  Math.sin(
   time*Math.PI*2
  )*.5+.5;


 sun.intensity=
  .65+night*1.25;


 scene.background.lerpColors?.(
  new THREE.Color(0x10182e),
  new THREE.Color(0x87ceeb),
  night
 );


 scene.fog.color.copy(
  scene.background
 );


 sky.material.color.copy(
  scene.background
 );


 updatePlayer();

 updateStats();

 renderer.render(
  scene,
  camera
 );

}


makeHotbar();

loadWorld();

camera.position.set(
 player.x,
 player.y,
 player.z
);

animate();

</script>

</body>
</html>
