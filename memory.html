<!DOCTYPE html>
<html>
<head>
<title>Memory Game - GameHub</title>

<style>
body {
    background: #111;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 40px;
}

h1 {
    font-size: 42px;
}

#game {
    width: 420px;
    margin: 30px auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.card {
    height: 90px;
    background: #6c2cff;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    cursor: pointer;
}

.card.flipped {
    background: #222;
}

button {
    background: #6c2cff;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🧠 Memory Game</h1>
<p>Find all matching pairs!</p>

<div id="game"></div>

<button onclick="startGame()">🔄 Restart Game</button>

<script>

let symbols = ["🎮","🎮","🔥","🔥","⚡","⚡","🚀","🚀"];
let first = null;
let second = null;
let lock = false;

function startGame() {
    let game = document.getElementById("game");
    game.innerHTML = "";
    
    symbols.sort(() => Math.random() - 0.5);

    first = null;
    second = null;
    lock = false;

    symbols.forEach((symbol) => {

        let card = document.createElement("div");
        card.className = "card";
        card.dataset.symbol = symbol;
        card.innerHTML = "❓";

        card.onclick = function() {

            if(lock || card.classList.contains("flipped")) return;

            card.classList.add("flipped");
            card.innerHTML = symbol;

            if(!first) {
                first = card;
            } else {
                second = card;
                lock = true;

                if(first.dataset.symbol === second.dataset.symbol) {
                    first = null;
                    second = null;
                    lock = false;
                } else {
                    setTimeout(() => {
                        first.classList.remove("flipped");
                        second.classList.remove("flipped");
                        first.innerHTML = "❓";
                        second.innerHTML = "❓";

                        first = null;
                        second = null;
                        lock = false;
                    }, 700);
                }
            }
        };

        game.appendChild(card);
    });
}

startGame();

</script>

</body>
</html>
