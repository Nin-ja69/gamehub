<!DOCTYPE html>
<html>
<head>
<title>Snake - GameHub</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    margin-top:30px;
    font-size:40px;
}

#score{
    font-size:24px;
    margin:15px;
}

canvas{
    background:#222;
    border:3px solid #6c2cff;
    max-width:90%;
}

button{
    margin-top:20px;
    padding:12px 25px;
    font-size:18px;
    background:#6c2cff;
    color:white;
    border:0;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>🐍 Snake Game</h1>

<div id="score">Score: 0</div>

<canvas id="game" width="400" height="400"></canvas>

<br>

<button onclick="restart()">🔄 Restart</button>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let snake;
let food;
let dx;
let dy;
let score;
let game;

function start(){
    snake=[
        {x:200,y:200},
        {x:180,y:200},
        {x:160,y:200}
    ];

    dx=20;
    dy=0;
    score=0;

    document.getElementById("score").textContent="Score: 0";

    food={
        x:Math.floor(Math.random()*20)*20,
        y:Math.floor(Math.random()*20)*20
    };

    clearInterval(game);
    game=setInterval(loop,120);
}

function loop(){
    const head={
        x:snake[0].x+dx,
        y:snake[0].y+dy
    };

    if(
        head.x<0 ||
        head.x>=400 ||
        head.y<0 ||
        head.y>=400 ||
        snake.some((part,index)=>
            index>0 &&
            part.x===head.x &&
            part.y===head.y
        )
    ){
        clearInterval(game);
        alert("Game Over! Score: "+score);
        return;
    }

    snake.unshift(head);

    if(head.x===food.x && head.y===food.y){
        score++;
        document.getElementById("score").textContent="Score: "+score;

        food={
            x:Math.floor(Math.random()*20)*20,
            y:Math.floor(Math.random()*20)*20
        };
    }else{
        snake.pop();
    }

    draw();
}

function draw(){
    ctx.fillStyle="#222";
    ctx.fillRect(0,0,400,400);

    ctx.fillStyle="#6c2cff";

    snake.forEach(part=>{
        ctx.fillRect(part.x,part.y,18,18);
    });

    ctx.fillStyle="red";
    ctx.fillRect(food.x,food.y,18,18);
}

function restart(){
    start();
}

document.addEventListener("keydown",function(e){

    if(e.key==="ArrowUp" && dy===0){
        dx=0;
        dy=-20;
    }

    if(e.key==="ArrowDown" && dy===0){
        dx=0;
        dy=20;
    }

    if(e.key==="ArrowLeft" && dx===0){
        dx=-20;
        dy=0;
    }

    if(e.key==="ArrowRight" && dx===0){
        dx=20;
        dy=0;
    }
});

start();
</script>

</body>
</html>
