<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe - GameHub</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        text-align: center;
    }

    h1 {
        margin-top: 40px;
        font-size: 42px;
    }

    #status {
        font-size: 22px;
        margin: 20px;
    }

    .board {
        width: 330px;
        height: 330px;
        margin: 30px auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
    }

    .cell {
        background: #222;
        border: 2px solid #6c2cff;
        border-radius: 10px;
        font-size: 60px;
        font-weight: bold;
        color: white;
        cursor: pointer;
    }

    .cell:hover {
        background: #333;
    }

    button {
        background: #6c2cff;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
    }

    button:hover {
        background: #8b55ff;
    }

    a {
        color: white;
        text-decoration: none;
    }
</style>
</head>

<body>

<h1>⭕ Tic Tac Toe ❌</h1>

<div id="status">Player X's Turn</div>

<div class="board">
    <button class="cell" onclick="move(0)"></button>
    <button class="cell" onclick="move(1)"></button>
    <button class="cell" onclick="move(2)"></button>
    <button class="cell" onclick="move(3)"></button>
    <button class="cell" onclick="move(4)"></button>
    <button class="cell" onclick="move(5)"></button>
    <button class="cell" onclick="move(6)"></button>
    <button class="cell" onclick="move(7)"></button>
    <button class="cell" onclick="move(8)"></button>
</div>

<button onclick="restart()">🔄 Restart Game</button>

<br><br>

<a href="index.html">⬅ Back to GameHub</a>

<script>
    let board = ["", "", "", "", "", "", "", "",];
    let currentPlayer = "X";
    let gameOver = false;

    const cells = document.querySelectorAll(".cell");
    const status = document.getElementById("status");

    const wins = [
        [0,1,2],
        [3,4,5],
        [6,7,8],
        [0,3,6],
        [1,4,7],
        [2,5,8],
        [0,4,8],
        [2,4,6]
    ];

    function move(index) {
        if (board[index] !== "" || gameOver) {
            return;
        }

        board[index] = currentPlayer;
        cells[index].textContent = currentPlayer;

        if (checkWinner()) {
            status.textContent = "🎉 Player " + currentPlayer + " Wins!";
            gameOver = true;
            return;
        }

        if (!board.includes("")) {
            status.textContent = "🤝 It's a Draw!";
            gameOver = true;
            return;
        }

        currentPlayer = currentPlayer === "X" ? "O" : "X";
        status.textContent = "Player " + currentPlayer + "'s Turn";
    }

    function checkWinner() {
        return wins.some(combo => {
            return combo.every(index => board[index] === currentPlayer);
        });
    }

    function restart() {
        board = ["", "", "", "", "", "", "", "",];
        currentPlayer = "X";
        gameOver = false;

        cells.forEach(cell => {
            cell.textContent = "";
        });

        status.textContent = "Player X's Turn";
    }
</script>

</body>
</html>
