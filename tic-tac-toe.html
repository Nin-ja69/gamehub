<!DOCTYPE html>
<html>
<head>
<title>Tic Tac Toe - GameHub</title>
<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}
h1{margin-top:40px;}
.board{
    display:grid;
    grid-template-columns:repeat(3,100px);
    gap:8px;
    justify-content:center;
    margin:30px auto;
}
.cell{
    width:100px;
    height:100px;
    font-size:50px;
    background:#222;
    color:white;
    border:2px solid #6c2cff;
    cursor:pointer;
}
button{
    padding:12px 25px;
    font-size:18px;
    background:#6c2cff;
    color:white;
    border:0;
    border-radius:8px;
    cursor:pointer;
}
#status{font-size:22px;}
</style>
</head>

<body>

<h1>❌ Tic Tac Toe ⭕</h1>
<p id="status">Player X's Turn</p>

<div class="board">
<button class="cell" onclick="move(0)"></button>
<button class="cell" onclick="move(1)"></button>
<button class="cell" onclick="move(2)"></button>
<button class="cell" onclick="move(3)"></button>
<button class="cell" onclick="move(4)"></button>
<button class="cell" onclick="move(5)"></button>
<button class="cell" onclick="move(6)"></button>
<button class="cell" onclick="move(7)"></button>
<button class="cell" onclick="move(8)"></button>
</div>

<button onclick="resetGame()">🔄 Restart Game</button>

<script>
let board=["","","","","","","","",""];
let player="X";
let gameOver=false;

function move(i){
    if(board[i]!=="" || gameOver) return;

    board[i]=player;
    document.querySelectorAll(".cell")[i].textContent=player;

    if(checkWin()){
        document.getElementById("status").textContent="🎉 Player "+player+" Wins!";
        gameOver=true;
        return;
    }

    if(!board.includes("")){
        document.getElementById("status").textContent="🤝 Draw!";
        gameOver=true;
        return;
    }

    player=player==="X"?"O":"X";
    document.getElementById("status").textContent="Player "+player+"'s Turn";
}

function checkWin(){
    const wins=[
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    return wins.some(w =>
        board[w[0]] &&
        board[w[0]]===board[w[1]] &&
        board[w[1]]===board[w[2]]
    );
}

function resetGame(){
    board=["","","","","","","","",""];
    player="X";
    gameOver=false;
    document.querySelectorAll(".cell").forEach(c=>c.textContent="");
    document.getElementById("status").textContent="Player X's Turn";
}
</script>

</body>
</html>
